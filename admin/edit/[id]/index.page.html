<page title="Edit Post - Admin">
<content>
  <script type="module" src="/blog/components/PostEdit.js"></script>
  <script type="module" src="/kempo-ui/components/Icon.js"></script>
  <div class="d-f mb">
    <div class="btn-grp mrh mb">
      <a href="/admin/extension/kempo-blog" class="btn">
        <k-icon name="arrow" direction="left"></k-icon> Blog
      </a>
      <a id="view-post-link" href="#" class="btn" style="display: none;">
        <k-icon name="visibility"></k-icon> View Post
      </a>
    </div>
    <div class="flex"></div>
    <div class="btn-grp mrh mb">
      <button id="delete-btn" class="btn danger">
        <k-icon name="delete"></k-icon> Delete
      </button>
    </div>
    <div class="btn-grp mrh mb">
      <button id="reset-btn" class="btn">
        <k-icon name="restart_alt"></k-icon> Reset
      </button>
      <button id="save-btn" class="btn primary">
        <k-icon name="save"></k-icon> Save
      </button>
    </div>
  </div>
  <h1 class="mb">Edit Post</h1>
  <k-blog-post-edit id="post-edit"></k-blog-post-edit>
  <div style="height:33vh"></div>
  <script type="module">
    import { getPostById } from '/blog/sdk.js';
    const postId = location.pathname.split('/').filter(Boolean).pop();
    const [err, data] = await getPostById(postId);
    const el = document.getElementById('post-edit');
    const viewLink = document.getElementById('view-post-link');
    const saveBtn = document.getElementById('save-btn');
    const deleteBtn = document.getElementById('delete-btn');
    const resetBtn = document.getElementById('reset-btn');
    
    saveBtn.disabled = true;
    
    if(err){
      el.innerHTML = `<p class="tc-error">${err.msg}</p>`;
    } else {
      el.setAttribute('path', data.post.path);
      const slug = data.post.path.replace('post/', '').replace('.page.html', '').replace(/^[^-]+-/, '');
      viewLink.href = `/post/${data.post.id}-${slug}`;
      viewLink.style.display = 'block';
      
      const origName = el.name;
      const origStatus = el.status;
      const origPublic = el.isPublic;
      const origTags = el.tags;
      const origContent = el.content;
      
      const checkDirty = () => {
        const dirty = el.name !== el.post?.name || el.status !== el.post?.status || el.isPublic !== el.post?.public || JSON.stringify(el.tags.split(',').map(t => t.trim()).filter(Boolean)) !== JSON.stringify(el.post?.tags) || el.content !== (el.post?.contents?.find(c => c.location === 'default')?.content || '');
        saveBtn.disabled = !dirty;
      };
      
      el.addEventListener('change', checkDirty);
    }
    
    const handleSave = () => el.save?.();
    saveBtn.addEventListener('click', handleSave);
    deleteBtn.addEventListener('click', () => el.delete?.());
    resetBtn.addEventListener('click', () => el.reset?.());
    
    document.addEventListener('keydown', e => {
      if((e.ctrlKey || e.metaKey) && e.key === 's'){
        e.preventDefault();
        handleSave();
      }
    });
  </script>
</content>
</page>
