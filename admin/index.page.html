<page title="Blog - Admin">
<content>
  <script type="module" src="/kempo-ui/components/Tabs.js"></script>
  <script type="module" src="/kempo-ui/components/Table.js"></script>
  <script type="module" src="/kempo-ui/components/controls/TcFirstPage.js"></script>
  <script type="module" src="/kempo-ui/components/controls/TcPrevPage.js"></script>
  <script type="module" src="/kempo-ui/components/controls/TcNextPage.js"></script>
  <script type="module" src="/kempo-ui/components/controls/TcLastPage.js"></script>
  <script type="module" src="/kempo-ui/components/controls/TcPageSelect.js"></script>
  <script type="module" src="/kempo-ui/components/controls/TcPageSize.js"></script>
  <script type="module" src="/kempo-ui/components/controls/TcOpen.js"></script>
  <script type="module" src="/kempo-ui/components/Icon.js"></script>
  <script type="module" src="/kempo-ui/components/Dialog.js"></script>
  <script type="module" src="/kempo-ui/components/Icon.js"></script>
  <div class="d-f mb">
    <h1 class="mb">Blog</h1>
    <div class="flex"></div>
    <k-permission has="kempo-blog:posts:create">
      <button id="new-post-btn" class="btn primary">
        <k-icon name="add"></k-icon> New Post
      </button>
    </k-permission>
  </div>

  <k-tabs id="post-tabs" active="published" hash-routing>
    <k-tab for="published">Published <span id="count-published"></span></k-tab>
    <k-tab for="draft">Draft <span id="count-draft"></span></k-tab>
    <k-tab for="disabled">Disabled <span id="count-disabled"></span></k-tab>

    <k-tab-content name="published">
      <k-table open-on-click id="table-published" enable-pages page-size="25" page-size-options="[10,25,50]" placeholder="No published posts.">
        <kc-tc-open slot="before" title="Edit"><k-icon name="edit"></k-icon></kc-tc-open>
        <div class="d-f full" style="align-items: center;">
          <div>
            <kc-tc-first-page></kc-tc-first-page>
            <kc-tc-prev-page></kc-tc-prev-page>
            <kc-tc-next-page></kc-tc-next-page>
            <kc-tc-last-page></kc-tc-last-page>
          </div>
          <div class="flex"></div>
          <div><kc-tc-page-select></kc-tc-page-select></div>
          <div class="flex"></div>
          <div><kc-tc-page-size></kc-tc-page-size></div>
        </div>
      </k-table>
    </k-tab-content>

    <k-tab-content name="draft">
      <k-table open-on-click id="table-draft" enable-pages page-size="25" page-size-options="[10,25,50]" placeholder="No draft posts.">
        <kc-tc-open slot="before" title="Edit"><k-icon name="edit"></k-icon></kc-tc-open>
        <div class="d-f full" style="align-items: center;">
          <div>
            <kc-tc-first-page></kc-tc-first-page>
            <kc-tc-prev-page></kc-tc-prev-page>
            <kc-tc-next-page></kc-tc-next-page>
            <kc-tc-last-page></kc-tc-last-page>
          </div>
          <div class="flex"></div>
          <div><kc-tc-page-select></kc-tc-page-select></div>
          <div class="flex"></div>
          <div><kc-tc-page-size></kc-tc-page-size></div>
        </div>
      </k-table>
    </k-tab-content>

    <k-tab-content name="disabled">
      <k-table open-on-click id="table-disabled" enable-pages page-size="25" page-size-options="[10,25,50]" placeholder="No disabled posts.">
        <kc-tc-open slot="before" title="Edit"><k-icon name="edit"></k-icon></kc-tc-open>
        <div class="d-f full" style="align-items: center;">
          <div>
            <kc-tc-first-page></kc-tc-first-page>
            <kc-tc-prev-page></kc-tc-prev-page>
            <kc-tc-next-page></kc-tc-next-page>
            <kc-tc-last-page></kc-tc-last-page>
          </div>
          <div class="flex"></div>
          <div><kc-tc-page-select></kc-tc-page-select></div>
          <div class="flex"></div>
          <div><kc-tc-page-size></kc-tc-page-size></div>
        </div>
      </k-table>
    </k-tab-content>

    <location name="blog-admin-tabs" />
  </k-tabs>

  <script type="module">
    import { getPosts, getPostsCounts } from '/blog/sdk.js';
    import Dialog from '/kempo-ui/components/Dialog.js';
    import { html } from '/kempo-ui/lit-all.min.js';

    const fields = [
      { name: 'name', label: 'Title' },
      { name: 'authorName', label: 'Author', size: 200 },
      { name: 'publicDisplay', label: 'Visibility', size: 100 },
      { name: 'createdDisplay', label: 'Created', size: 120 },
    ];

    const mapPost = p => ({
      ...p,
      _url: `/admin/extension/kempo-blog/edit/${p.id}`,
      postUrl: `/${p.path.replace('.page.html', '')}`,
      publicDisplay: p.public ? 'Public' : 'Private',
      createdDisplay: new Date(p.created).toLocaleDateString(),
    });

    const initialized = {};

    const initTable = async (status) => {
      if(initialized[status]) return;
      initialized[status] = true;

      const table = document.getElementById(`table-${status}`);
      const [err, data] = await getPosts({ limit: table.getPageSize(), offset: 0, status });
      if(err){
        table.setAttribute('placeholder', err.msg);
        return;
      }

      table.setData({ fields, records: data.posts.map(mapPost) });
      table.setupFetchRecords(data.total, async (start, count) => {
        const [e, d] = await getPosts({ limit: count, offset: start, status });
        if(e) return [];
        return d.posts.map(mapPost);
      });
    };

    const loadCounts = async () => {
      const [err, counts] = await getPostsCounts();
      if(!err){
        document.getElementById('count-draft').textContent = `(${counts.draft})`;
        document.getElementById('count-published').textContent = `(${counts.published})`;
        document.getElementById('count-disabled').textContent = `(${counts.disabled})`;
      }
    };

    const tabsElement = document.getElementById('post-tabs');

    // Each tab loads its posts the first time it is shown.
    const loadWhenShown = status => {
      const pane = document.getElementById(`table-${status}`).closest('k-tab-content');
      if(pane.active) initTable(status);
      else tabsElement.addEventListener('tabfirstshown', ({ detail }) => {
        if(detail.tab === pane.name) initTable(status);
      });
    };
    ['published', 'draft', 'disabled'].forEach(loadWhenShown);

    loadCounts();

    const newPostBtn = document.getElementById('new-post-btn');
    
    const handleCreatePost = async (titleValue) => {
      const title = (titleValue || '').trim();
      if(!title){
        alert('Please enter a post title');
        return;
      }
      const { createPost } = await import('/blog/sdk.js');
      const [err, result] = await createPost({ name: title, status: 'draft', public: true, tags: [] });
      if(err){ alert('Error: ' + err.msg); return; }
      window.location.href = `/admin/extension/kempo-blog/edit/${result.post.postId}`;
    };

    newPostBtn.addEventListener('click', async () => {
      let postTitle = '';
      const $dialog = Dialog.create(html`
        <div class="p">
          <label class="d-b mb">Post Title</label>
          <input type="text" id="new-post-title" class="full" placeholder="Enter post title...">
        </div>
      `, {
        title: 'New Post',
        confirmText: 'Create',
        confirmAction: async () => {
          postTitle = document.getElementById('new-post-title')?.value || '';
          if(postTitle.trim()) {
            await handleCreatePost(postTitle);
          }
        }
      });
    });
  </script>
</content>
</page>
