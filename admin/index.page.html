<page title="Blog - Admin">
<content>
  <script type="module" src="/kempo-ui/components/Table.js"></script>
  <script type="module" src="/kempo-ui/components/tableControls/FirstPage.js"></script>
  <script type="module" src="/kempo-ui/components/tableControls/PrevPage.js"></script>
  <script type="module" src="/kempo-ui/components/tableControls/NextPage.js"></script>
  <script type="module" src="/kempo-ui/components/tableControls/LastPage.js"></script>
  <script type="module" src="/kempo-ui/components/tableControls/PageSelect.js"></script>
  <script type="module" src="/kempo-ui/components/tableControls/PageSize.js"></script>
  <script type="module" src="/admin/components/TableRowLink.js"></script>
  <script type="module" src="/kempo-ui/components/Icon.js"></script>
  <script type="module">
    import TableControl from '/kempo-ui/components/tableControls/TableControl.js';
    import { html } from '/kempo-ui/lit-all.min.js';

    class BlogPostViewLink extends TableControl {
      static get properties() {
        return { fieldName: { type: String, attribute: 'field-name' } };
      }

      constructor() {
        super({ maxWidth: 40 });
        this.fieldName = 'postUrl';
      }

      open = () => {
        if(!this.record) return;
        const url = this.record[this.fieldName];
        if(url) window.open(url, '_blank', 'noopener,noreferrer');
      };

      render() {
        return html`<button class="no-btn icon-btn" @click="${this.open}"><k-icon name="open_in_new"></k-icon></button>`;
      }
    }

    customElements.define('blog-post-view-link', BlogPostViewLink);
  </script>
  <div class="d-f mb" style="align-items: center; gap: var(--spacer)">
    <h1 class="flex mb0">Blog Posts</h1>
    <a href="/admin/extension/kempo-blog/create" class="btn">New Post</a>
  </div>
  <k-table
    id="posts-table"
    enable-pages
    page-size="25"
    page-size-options="[10,25,50,100]"
    placeholder="No posts yet."
  >
    <blog-post-view-link slot="before" field-name="postUrl"></blog-post-view-link>
    <admin-table-row-link
      slot="after"
      url-pattern="/admin/extension/kempo-blog/edit/{postId}"
      field-name="postId"
    >
      <k-icon name="edit"></k-icon>
    </admin-table-row-link>
    <div class="d-f full" style="align-items: center;">
      <div>
        <k-tc-first-page></k-tc-first-page>
        <k-tc-prev-page></k-tc-prev-page>
        <k-tc-next-page></k-tc-next-page>
        <k-tc-last-page></k-tc-last-page>
      </div>
      <div class="flex"></div>
      <div><k-tc-page-select></k-tc-page-select></div>
      <div class="flex"></div>
      <div><k-tc-page-size></k-tc-page-size></div>
    </div>
  </k-table>
  <script type="module">
    import { getPosts } from '/blog/sdk.js';

    await window.customElements.whenDefined('k-table');

    const table = document.getElementById('posts-table');
    const [err, data] = await getPosts({ limit: 100, offset: 0 });
    if(err){
      table.setAttribute('placeholder', err.msg);
    } else {
      const records = data.posts.map(p => {
        const postId = p.path.split('/').pop().split('-')[0];
        return {
          ...p,
          postId,
          postUrl: `/${p.path.replace('.page.html', '')}`,
          displayName: p.name || p.path.split('/').pop().replace('.page.html', ''),
          statusDisplay: `${p.status}${p.public ? '' : ' (private)'}`,
          createdDisplay: new Date(p.created).toLocaleDateString()
        };
      });
      table.setData({
        records,
        fields: [
          { name: 'displayName', label: 'Title', size: 300 },
          { name: 'author', label: 'Author', size: 150 },
          { name: 'statusDisplay', label: 'Status', size: 130 },
          { name: 'createdDisplay', label: 'Created', size: 120 }
        ]
      });
    }
  </script>
</content>
</page>
