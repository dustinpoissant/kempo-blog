<page title="Author Posts">
<content>
  <script type="module" src="/blog/components/PostList.js"></script>
  <script type="module" src="/blog/components/PostSummary.js"></script>
  <script type="module" src="/blog/components/PostAuthor.js"></script>
  <script type="module" src="/blog/components/PostTags.js"></script>
  <script type="module" src="/kempo-ui/components/Icon.js"></script>
  <script type="module" src="/kempo/components/UserDisplayName.js"></script>
  <div class="d-f mb" style="align-items: center; gap: var(--spacer)">
    <a href="/blog" class="btn">
      <k-icon name="arrow" direction="left"></k-icon> Back to Blog
    </a>
    <div id="author-links" class="d-f" style="gap: var(--spacer_h); display: none !important"></div>
  </div>
  <h1>Posts by <k-user-display-name id="author-name"></k-user-display-name></h1>
  <k-blog-post-list id="post-list" status="published"></k-blog-post-list>
  <script type="module">
    const segments = window.location.pathname.split('/').filter(Boolean);
    const authorId = segments[segments.indexOf('author') + 1];
    if(authorId){
      document.getElementById('post-list').setAttribute('author', authorId);
      document.getElementById('author-name').setAttribute('user-id', authorId);
      (async () => {
        const res = await fetch('/kempo/api/auth/session');
        const { user } = await res.json();
        if(user?.id === authorId){
          const links = document.getElementById('author-links');
          links.style.removeProperty('display');
          links.innerHTML = `
            <a href="/blog/author/${authorId}/drafts" class="btn">Drafts</a>
            <a href="/blog/author/${authorId}/disabled" class="btn">Disabled</a>
          `;
        }
      })();
    }
  </script>
</content>
</page>
