<!--
template: default
-->
<page title="Blog" requires-auth="true">
<content>
  <script type="module" src="/blog/components/PostList.js"></script>
  <script type="module" src="/blog/components/PostSummary.js"></script>
  <script type="module" src="/blog/components/PostAuthor.js"></script>
  <script type="module" src="/blog/components/PostTags.js"></script>
  <script type="module" src="/kempo-ui/components/Card.js"></script>
  <script type="module" src="/kempo-ui/components/Tags.js"></script>
  <script type="module" src="/kempo-ui/components/Combobox.js"></script>
  <script type="module" src="/kempo-ui/components/Calendar.js"></script>
  <script type="module" src="/kempo-ui/components/Dialog.js"></script>
  <script type="module" src="/kempo-ui/components/Icon.js"></script>
  <div class="d-f mb" style="align-items: center; gap: var(--spacer)">
    <h1 class="flex mb0">Blog</h1>
    <button id="filter-btn" class="btn">
      <k-icon name="filter"></k-icon> Filter
    </button>
    <k-permission has="kempo-blog:posts:create">
      <button id="create-post-btn" class="btn primary">
        <k-icon name="add"></k-icon> New Post
      </button>
    </k-permission>
  </div>
  <k-card id="filter-card" label="Filters" class="mb" style="display:none">
    <div class="mb">
      <label class="d-b mb-sm">Author</label>
      <k-combobox id="author-filter" placeholder="Search authors..." debounce-ms="400" require-match empty-message="Search for an Author"></k-combobox>
    </div>
    <k-tags id="tag-filter"><label>Tags</label></k-tags>
    <div class="mt">
      <label class="d-b mb-sm">Created Date Range</label>
      <k-calendar id="date-filter" mode="range" max="today"></k-calendar>
    </div>
  </k-card>
  <k-blog-post-list id="post-list" status="published"></k-blog-post-list>
  <script type="module">
    const params = new URLSearchParams(location.search);
    const list = document.getElementById('post-list');
    const filterBtn = document.getElementById('filter-btn');
    const filterCard = document.getElementById('filter-card');
    const tagFilter = document.getElementById('tag-filter');
    const authorFilter = document.getElementById('author-filter');
    const dateFilter = document.getElementById('date-filter');
    const initialTags = params.get('tags') || params.get('tag') || '';
    const initialAuthor = params.get('author') || '';
    const initialCreated = params.get('created') || '';

    const applyFilters = ({ tags = list.tag, author = list.author, created = (list['created-after'] ? `${list['created-after']},${list['created-before']}` : '') } = {}) => {
      const [createdAfter = '', createdBefore = ''] = created ? created.split(',') : [];
      list.tag = tags;
      list.author = author;
      list['created-after'] = createdAfter;
      list['created-before'] = createdBefore;
      list.load();
      const url = new URL(location.href);
      if(tags) url.searchParams.set('tags', tags);
      else url.searchParams.delete('tags');
      url.searchParams.delete('tag');
      if(author) url.searchParams.set('author', author);
      else url.searchParams.delete('author');
      if(created) url.searchParams.set('created', created);
      else url.searchParams.delete('created');
      history.replaceState({}, '', url);
      const hasFilters = !!(tags || author || created);
      if(filterCard.style.display === 'none') filterBtn.classList.toggle('primary', hasFilters);
    };

    const setDisabled = (disabled) => {
      tagFilter.toggleAttribute('disabled', disabled);
      authorFilter.disabled = disabled;
      dateFilter.disabled = disabled;
    };

    if(initialTags || initialAuthor || initialCreated){
      if(initialTags) tagFilter.setAttribute('value', initialTags);
      if(initialCreated) dateFilter.setAttribute('value', initialCreated);
      list.tag = initialTags;
      list.author = initialAuthor;
      if(initialCreated){
        const [after = '', before = ''] = initialCreated.split(',');
        list['created-after'] = after;
        list['created-before'] = before;
      }
      filterCard.style.display = '';
      filterBtn.classList.add('primary');
      if(initialAuthor){
        fetch(`/blog/api/authors?q=`)
          .then(r => r.json())
          .then(data => {
            const found = (data.authors || []).find(a => a.id === initialAuthor);
            if(found) authorFilter.setOptions([{ label: found.name, value: found.id }]);
          });
      }
    } else {
      setDisabled(true);
    }

    const closeFilters = () => {
      filterCard.style.display = 'none';
      setDisabled(true);
      authorFilter.clear?.();
      applyFilters({ tags: '', author: '', created: '' });
    };

    const openFilters = () => {
      filterCard.style.display = '';
      setDisabled(false);
      filterBtn.classList.add('primary');
    };

    filterBtn.addEventListener('click', () => {
      if(filterCard.style.display === 'none') openFilters();
      else closeFilters();
    });

    tagFilter.addEventListener('change', e => applyFilters({ tags: e.detail?.newValue || '' }));

    authorFilter.addEventListener('search', async e => {
      authorFilter.searching = true;
      const res = await fetch(`/blog/api/authors?q=${encodeURIComponent(e.detail.value)}`);
      const data = await res.json();
      authorFilter.setOptions((data.authors || []).map(a => ({ label: a.name, value: a.id })));
      authorFilter.searching = false;
    });

    authorFilter.addEventListener('select', e => applyFilters({ author: e.detail.value }));
    authorFilter.addEventListener('change', e => { if(!e.target.value) applyFilters({ author: '' }); });

    dateFilter.addEventListener('change', e => applyFilters({ created: e.detail.value || '' }));
  </script>
  <script type="module">
    import Dialog from '/kempo-ui/components/Dialog.js';
    import { html } from '/kempo-ui/lit-all.min.js';
    import { createPost } from '/blog/sdk.js';

    const createBtn = document.getElementById('create-post-btn');
    if(createBtn){
      createBtn.addEventListener('click', () => {
        let postTitle = '';
        Dialog.create(html`
          <div class="p">
            <label class="d-b mb">Post Title</label>
            <input type="text" id="new-post-title" class="full" placeholder="Enter post title..." autofocus>
          </div>
        `, {
          title: 'New Post',
          confirmText: 'Create',
          confirmAction: async () => {
            postTitle = document.getElementById('new-post-title')?.value.trim() || '';
            if(!postTitle){ alert('Please enter a post title'); return; }
            const [err, result] = await createPost({ name: postTitle, status: 'draft', public: true, tags: [] });
            if(err){ alert('Error: ' + err.msg); return; }
            window.location.href = `/blog/edit/${result.post.postId}`;
          }
        });
      });
    }
  </script>
</content>
</page>
