<page title="Edit Post" requires-auth="true">
<content>
  <script type="module" src="/blog/components/PostEdit.js"></script>
  <h1>Edit Post</h1>
  <k-blog-post-edit id="post-edit"></k-blog-post-edit>
  <script type="module">
    import { getPostById } from '/blog/sdk.js';
    const postId = location.pathname.split('/').filter(Boolean).pop();
    const [err, data] = await getPostById(postId);
    const el = document.getElementById('post-edit');
    if(err){
      el.innerHTML = `<p class="tc-error">${err.msg}</p>`;
    } else {
      el.setAttribute('path', data.post.path);
    }
  </script>
</content>
</page>
