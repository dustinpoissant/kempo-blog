<!--
template: default
-->
<page title="Blog Posts">
<content>
  <script type="module" src="/blog/posts/components/PostList.js"></script>
  <script type="module" src="/blog/posts/components/PostSummary.js"></script>
  <script type="module" src="/blog/posts/components/PostAuthor.js"></script>
  <script type="module" src="/blog/posts/components/PostTags.js"></script>
  <h1>Blog Posts</h1>
  <k-blog-post-list id="post-list" status="published"></k-blog-post-list>
  <script type="module">
    const params = new URLSearchParams(location.search);
    const list = document.getElementById('post-list');
    if(params.get('tag')) list.setAttribute('tag', params.get('tag'));
    if(params.get('category')) list.setAttribute('category', params.get('category'));
    if(params.get('author')) list.setAttribute('author', params.get('author'));
  </script>
</content>
</page>
