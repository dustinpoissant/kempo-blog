name: Run Unit Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  # kempo resolves from the registry, which is what a site installing this extension gets.
  published:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - run: npm ci

      # No database or RESEND_API_KEY required: both clients are constructed lazily.
      - name: Run Unit Tests
        run: npm test

  # Same suite against the sibling checkout of the host. This extension resolves ~42 imports out of
  # kempo, so it breaks whenever the host moves something it reaches into — this job is what
  # surfaces that before a release, and it is advisory rather than blocking.
  siblings:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          path: kempo-blog

      - uses: actions/checkout@v4
        with:
          repository: dustinpoissant/kempo
          path: kempo

      # Reached transitively: kempo/server/sdk.js re-exports sendEmailFromTemplate, which imports
      # kempo-server/templating.
      - uses: actions/checkout@v4
        with:
          repository: dustinpoissant/kempo-server
          path: kempo-server

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install host
        run: npm ci && npm run link:local
        working-directory: kempo

      - run: npm ci
        working-directory: kempo-blog

      - name: Link sibling checkout
        run: npm run link:local
        working-directory: kempo-blog

      - name: Run Unit Tests
        run: npm test
        working-directory: kempo-blog
