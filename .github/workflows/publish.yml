name: Publish to npmjs

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      version-type:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - name: Build project and documentation
        run: |
          npm run build

      # kempo is a peer dependency and is not installed by `npm ci` here, so the suite — which
      # imports through it — needs it present. The published release is the right one to test
      # against: it is what a site installing this extension will actually pair it with.
      - name: Install the host for the test gate
        run: npm install --no-save kempo@latest kempo-server@latest

      - name: Run Unit Tests
        run: npm test

      - name: Set version type
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "type=${{ inputs.version-type }}" >> $GITHUB_OUTPUT
          else
            echo "type=patch" >> $GITHUB_OUTPUT
          fi

      - name: Bump ${{ steps.version.outputs.type }} version
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          npm version ${{ steps.version.outputs.type }} --no-git-tag-version
          git add -A || true
          git commit -m "ci: bump ${{ steps.version.outputs.type }} version [skip ci]" || echo "No changes to commit"
          # Must be the branch that triggered this run. Hardcoding main pushed every bump onto a
          # stale branch while releases happen from master, so the version in git silently fell
          # behind npm until a publish collided with an already-published version.
          git push origin HEAD:${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm publish --access public
